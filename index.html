<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src https://script.google.com https://script.googleusercontent.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0F2019">
<title>Metabot Logbook</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%2318342A'/%3E%3Cpath d='M7 22.5C7 15 12.8 9.5 20 9.5S33 15 33 22.5z' fill='%236FF0CF'/%3E%3Crect x='16.5' y='22.5' width='7' height='10' rx='2.5' fill='%23CDEFE3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#F2F6F3; --surface:#FFFFFF; --surface-2:#E8EFEA; --ink:#14241D; --ink-2:#4A5D54; --ink-3:#6E8279; --line:#D0DBD4;
  --accent:#0A7B6F; --accent-2:#07615A; --accent-soft:#D3EDE6; --accent-ink:#FFFFFF;
  --night:#0F2019; --night-2:#18342A; --night-ink:#E4F3ED; --night-sub:#A6C8BA; --glow:#6FF0CF;
  --ok:#15803D; --ok-soft:#DDF3E4; --mid:#B45309; --mid-soft:#FCEBD4; --bad:#B42318; --bad-soft:#FBE2DE;
  --focus:#1D6FE0;
  --v-discovery:#2F6BD0; --v-innovation:#7A4BCB; --v-impact:#16865A; --v-inclusion:#C4473F; --v-teamwork:#B86E0C; --v-fun:#C23F79;
  --f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0B1511; --surface:#12201A; --surface-2:#1A2B24; --ink:#E2EEE8; --ink-2:#A6BBB1; --ink-3:#80968C; --line:#29413A;
    --accent:#35C9AF; --accent-2:#5DDAC3; --accent-soft:#143A32; --accent-ink:#04201A;
    --night:#07110D; --night-2:#12261E; --night-ink:#E2EEE8; --night-sub:#8FB3A5;
    --ok:#4ADE80; --ok-soft:#12321F; --mid:#F5A524; --mid-soft:#3A2A0E; --bad:#F87171; --bad-soft:#3A1614;
    --focus:#7FB3FF;
    --v-discovery:#79A6F2; --v-innovation:#B08CF0; --v-impact:#4CC98F; --v-inclusion:#F08A80; --v-teamwork:#F0B055; --v-fun:#F07FB0;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0B1511; --surface:#12201A; --surface-2:#1A2B24; --ink:#E2EEE8; --ink-2:#A6BBB1; --ink-3:#80968C; --line:#29413A;
  --accent:#35C9AF; --accent-2:#5DDAC3; --accent-soft:#143A32; --accent-ink:#04201A;
  --night:#07110D; --night-2:#12261E; --night-ink:#E2EEE8; --night-sub:#8FB3A5;
  --ok:#4ADE80; --ok-soft:#12321F; --mid:#F5A524; --mid-soft:#3A2A0E; --bad:#F87171; --bad-soft:#3A1614;
  --focus:#7FB3FF;
  --v-discovery:#79A6F2; --v-innovation:#B08CF0; --v-impact:#4CC98F; --v-inclusion:#F08A80; --v-teamwork:#F0B055; --v-fun:#F07FB0;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin-inline:auto;padding-inline:16px}
@media (min-width:720px){.wrap{padding-inline:28px}}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0;font-weight:800}
p{margin:0}
.mono{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.06em;text-transform:uppercase}
.muted{color:var(--ink-2)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;padding:0;margin:-1px}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* header */
.top{background:var(--night);color:var(--night-ink);position:relative;overflow:hidden}
.top::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.85;background:
  radial-gradient(3px 3px at 8% 28%,var(--glow),transparent 70%),
  radial-gradient(2px 2px at 17% 74%,var(--glow),transparent 70%),
  radial-gradient(4px 4px at 31% 40%,rgba(111,240,207,.7),transparent 70%),
  radial-gradient(2px 2px at 46% 18%,var(--glow),transparent 70%),
  radial-gradient(3px 3px at 58% 80%,rgba(111,240,207,.6),transparent 70%),
  radial-gradient(2px 2px at 71% 30%,var(--glow),transparent 70%),
  radial-gradient(5px 5px at 86% 62%,rgba(111,240,207,.45),transparent 70%),
  radial-gradient(2px 2px at 94% 22%,var(--glow),transparent 70%),
  radial-gradient(420px 120px at 12% 110%,rgba(111,240,207,.14),transparent 70%)}
.top-in{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:14px 20px;padding-block:18px}
.brand{display:flex;align-items:center;gap:12px;flex:1 1 300px;min-width:0}
.brand svg{width:42px;height:42px;flex:none;filter:drop-shadow(0 0 10px rgba(111,240,207,.35))}
.brand h1{font-size:1.55rem;letter-spacing:-.01em}
.brand .sub{color:var(--night-sub);font-family:var(--f-mono);font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;margin-top:3px}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}

/* buttons */
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:700;font-size:.95rem;padding:8px 14px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;min-height:40px;text-decoration:none;line-height:1.2}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.small{min-height:32px;padding:5px 10px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.top .btn{background:transparent;color:var(--night-ink);border-color:#335446}
.top .btn:hover{border-color:var(--glow)}
.top .btn.primary{background:var(--glow);color:#06231B;border-color:var(--glow)}
.linkbtn{appearance:none;background:none;border:0;padding:0;font:inherit;color:var(--accent);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

main{padding-block:24px 64px;display:grid;gap:22px}
main>*,.tabs-wrap{min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
.panel h3{font-size:1.2rem}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-title h2{font-size:1.35rem}

/* home */
.upnext{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:760px){.upnext{grid-template-columns:1fr}}
.upnext .big{font-size:2rem;margin-top:4px}
.upnext .plan-line{margin-top:6px;color:var(--ink-2)}
.upnext .actions{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap}
.howto{list-style:none;margin:0;padding:0;display:grid;gap:10px;counter-reset:how}
.howto li{display:grid;grid-template-columns:28px 1fr;gap:10px;font-size:.93rem;color:var(--ink-2)}
.howto li::before{counter-increment:how;content:counter(how);width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent-2);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:.9rem}
.howto b{color:var(--ink)}

.slist{display:grid;gap:8px}
.srow{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;font:inherit;color:inherit}
.srow:hover{border-color:var(--accent)}
.srow .n,.srow .t,.srow .d,.srow .mid{display:block}
.srow .mid{min-width:0}
.srow .n{font-family:var(--f-display);font-weight:800;font-size:1.9rem;color:var(--accent);text-align:center;font-variant-numeric:tabular-nums;line-height:1}
.srow .t{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .d{color:var(--ink-2);font-size:.85rem}
.srow .meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:560px){.srow{grid-template-columns:48px minmax(0,1fr)}.srow .meta{grid-column:2;justify-content:flex-start}}
.dots{display:flex;gap:4px}
.vdots{display:flex;gap:3px}
.vdot{width:10px;height:10px;border-radius:50%;background:var(--vc)}
.count-chip{font-family:var(--f-mono);font-size:.72rem;color:var(--ink-2);white-space:nowrap}

.plan{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:6px;align-content:start}
.pcard.done{border-color:var(--accent);background:linear-gradient(0deg,var(--surface),var(--surface)) padding-box}
.pcard .ph{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pcard ul{margin:0;padding-left:18px;font-size:.88rem;color:var(--ink-2)}
.pcard .st{font-size:.8rem;color:var(--ink-3)}
.pcard.done .st{color:var(--accent)}
.cvtag{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--ink-2);white-space:nowrap}

/* avatars */
.av{--kid:var(--accent);width:28px;height:28px;border-radius:50%;background:var(--kid);color:#fff;display:inline-grid;place-items:center;font-weight:700;font-size:.72rem;flex:none;letter-spacing:.02em}
.av.lg{width:52px;height:52px;font-size:1.1rem}
.av.sm{width:22px;height:22px;font-size:.6rem}
.av.off{opacity:.28}
.av.full{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--kid)}

/* session */
.shead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.shead .eyebrow{color:var(--accent)}
.stitle{font-size:2.1rem;margin-top:2px}
.planline{color:var(--ink-2);margin-top:4px;font-size:.93rem}
.save{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;padding:5px 10px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2);background:var(--surface);cursor:default}
.save.ok{color:var(--ok);border-color:var(--ok)}
.save.warn{color:var(--mid);border-color:var(--mid)}
.save.err{color:var(--bad);border-color:var(--bad);cursor:pointer}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:thin}
.tab{appearance:none;font:inherit;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;padding:8px 14px 8px 8px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface-2);color:var(--ink);cursor:pointer;font-weight:700}
.tab.team{padding-left:14px}
.tab[aria-selected="true"]{background:var(--surface);border-color:var(--kid,var(--accent));box-shadow:0 0 0 2px color-mix(in srgb,var(--kid,var(--accent)) 25%,transparent)}
.tab .pr{font-family:var(--f-mono);font-size:.68rem;color:var(--ink-3);font-weight:500}
.tab .pr.ok{color:var(--ok)}
.sbody{display:grid;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 22px 22px;border-top:5px solid var(--kid,var(--accent))}
@media (max-width:560px){.sbody{padding:4px 14px 18px}}
.kidhead{display:flex;align-items:center;gap:14px;padding-block:18px 14px}
.kidhead h3{font-size:1.6rem}
.step{display:grid;grid-template-columns:44px minmax(0,1fr);gap:14px;padding-block:20px;border-top:1px solid var(--line)}
@media (max-width:560px){.step{grid-template-columns:32px minmax(0,1fr);gap:10px}}
.step-n{width:38px;height:38px;border-radius:50%;background:color-mix(in srgb,var(--kid,var(--accent)) 16%,var(--surface));color:var(--kid,var(--accent-2));font-family:var(--f-display);font-weight:800;display:grid;place-items:center;font-size:1.15rem}
@media (max-width:560px){.step-n{width:30px;height:30px;font-size:.95rem}}
.step-body{display:grid;gap:10px;min-width:0}
.step-body h4{font-size:1.25rem}
.hint{color:var(--ink-2);font-size:.92rem}
.given{background:var(--surface-2);border-radius:10px;padding:12px 14px;display:grid;gap:4px}
.given .lab{color:var(--ink-3)}
.given .txt{font-size:1.05rem;white-space:pre-wrap}
.given .none{color:var(--ink-3);font-style:italic}

textarea,input[type=text],input[type=number],input[type=date],select{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:92px;resize:vertical;font-size:1.06rem;line-height:1.5}
textarea.small{min-height:60px;font-size:1rem}
textarea:focus,input:focus,select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
textarea:disabled,input:disabled,select:disabled{background:var(--surface-2);color:var(--ink-2)}
.tb{display:grid;gap:4px}
.lbl{font-weight:700;font-size:.95rem}
.count{color:var(--ink-3);text-align:right;min-height:1em;font-size:.68rem}

.choices{display:flex;flex-wrap:wrap;gap:8px}
.choice{appearance:none;font:inherit;font-weight:700;font-size:1rem;padding:10px 16px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;min-height:46px}
.choice:hover{border-color:var(--ink-3)}
.choice[aria-pressed="true"].ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.choice[aria-pressed="true"].mid{background:var(--mid-soft);border-color:var(--mid);color:var(--mid)}
.choice[aria-pressed="true"].bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.choice[aria-pressed="true"].na{background:var(--surface-2);border-color:var(--ink-3);color:var(--ink-2)}
.choice:disabled{cursor:not-allowed;opacity:.7}

.toggles{display:flex;flex-wrap:wrap;gap:8px}
.toggle{appearance:none;font:inherit;font-size:.92rem;font-weight:700;padding:7px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink-2);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.toggle[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-2)}
.toggle:disabled{cursor:not-allowed}

.values{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:640px){.values{grid-template-columns:repeat(2,minmax(0,1fr))}}
.vcard{appearance:none;font:inherit;text-align:left;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);color:var(--ink);cursor:pointer;display:grid;gap:2px;min-height:74px;align-content:start}
.vcard .vn{font-family:var(--f-display);font-weight:800;font-size:1.08rem;color:var(--vc);display:flex;align-items:center;gap:6px}
.vcard .vn::before{content:"";width:10px;height:10px;border-radius:50%;border:2px solid var(--vc);flex:none}
.vcard .vl{font-size:.82rem;color:var(--ink-2);line-height:1.35}
.vcard[aria-pressed="true"]{border-color:var(--vc);background:var(--surface-2);background:color-mix(in srgb,var(--vc) 12%,var(--surface))}
.vcard[aria-pressed="true"] .vn::before{background:var(--vc)}
.vcard:disabled{cursor:not-allowed}
.vcard:disabled:not([aria-pressed="true"]){opacity:.55}

.starters{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.starters .lab{color:var(--ink-3);font-size:.8rem;margin-right:2px}
.starter{appearance:none;font:inherit;font-size:.86rem;border:1px dashed var(--ink-3);border-radius:999px;padding:4px 11px;background:transparent;color:var(--ink-2);cursor:pointer}
.starter:hover{border-style:solid;border-color:var(--accent);color:var(--accent-2)}

.mblock{display:grid;gap:10px}
.media{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.mcard{margin:0;display:grid;gap:6px;align-content:start;background:var(--surface-2);border-radius:10px;padding:8px}
.mimg{position:relative;aspect-ratio:4/3;max-width:100%;border-radius:7px;overflow:hidden;background:var(--surface)}
.mimg img{width:100%;height:100%;object-fit:contain;display:block}
.mimg .kind{position:absolute;left:6px;top:6px;background:rgba(10,24,18,.78);color:#fff;border-radius:4px;padding:2px 6px;font-size:.62rem}
.mmissing{display:grid;place-items:center;height:100%;color:var(--ink-3);font-size:.85rem;padding:8px;text-align:center}
.mcard input{font-size:.9rem;padding:7px 9px;border-radius:7px}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap;font-size:.85rem}
.mctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:.88rem;color:var(--ink-2);cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.mstatus{font-size:.9rem;color:var(--ink-2);min-height:1.2em}
.mstatus.err{color:var(--bad)}
.empty{color:var(--ink-3);font-size:.92rem;font-style:italic}

.nextbar{display:flex;justify-content:flex-end;padding-top:18px;border-top:1px solid var(--line)}
details.example{background:var(--surface-2);border-radius:10px;padding:10px 14px;margin-top:4px}
details.example summary{cursor:pointer;font-weight:700;color:var(--accent-2)}
details.example dl{margin:10px 0 0;display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 14px;font-size:.92rem}
details.example dt{font-weight:700}
details.example dd{margin:0;color:var(--ink-2)}
@media (max-width:560px){details.example dl{grid-template-columns:1fr}details.example dd{margin-bottom:6px}}

.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid4{display:grid;grid-template-columns:110px 1fr 1fr;gap:12px}
@media (max-width:640px){.grid2,.grid4{grid-template-columns:1fr}}
.qs{margin:0;padding-left:20px;color:var(--ink-2);display:grid;gap:4px;font-size:.95rem}
.ev{display:grid;gap:8px}
.ev .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ev .row b{min-width:150px;font-size:.9rem}
.danger-zone{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

/* dialogs */
.overlay{position:fixed;inset:0;background:rgba(6,18,13,.55);display:grid;place-items:center;padding:16px;z-index:40}
.dialog{background:var(--surface);color:var(--ink);border-radius:14px;width:100%;max-width:540px;max-height:calc(100% - 32px);overflow:auto;padding:20px 22px;display:grid;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.dialog.wide{max-width:680px}
.dhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dhead h3{font-size:1.3rem}
.x{appearance:none;border:0;background:transparent;color:var(--ink-2);font-size:1.6rem;line-height:1;cursor:pointer;padding:2px 8px;border-radius:6px}
.dfoot{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.field{display:grid;gap:4px}
.field label{font-weight:700;font-size:.9rem}
.status{font-size:.92rem;color:var(--ink-2);min-height:1.3em}
.status.err{color:var(--bad)}
.status.ok{color:var(--ok)}
.kidedit{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center}

.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--night);color:var(--night-ink);padding:10px 16px;border-radius:10px;font-size:.92rem;max-width:calc(100% - 32px);z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.3)}

<script>
(() => {

const HW = [

  { k:'partly', label:'Partly done', cls:'mid' },

  { k:'none',   label:'No homework', cls:'na'  },

const HWL = Object.fromEntries(HW.map(o => [o.k, o.label]));

const EV_AREAS = [ { k:'rd', label:'Robot Design' }, { k:'ip', label:'Innovation Project' } ];
const EV_STEPS = ['Identify','Design','Create','Iterate','Communicate'];
const DID_STARTERS = ['Today I built ','I programmed the robot to ','I tested ','I changed ','I researched ','I drew a sketch of ','I helped my team by '];

  { k:'EQ',  name:'Equipment inspection bonus' },

/* Worksheets. Field types: text, textarea, date, number, select, kids (team members), multi. */
const SHEETS = {

    head: r => r.source || 'New source', sub: r => [r.type, r.date && fmtDate(r.date)].filter(Boolean).join(' · ') },

      { k:'details', label:'How it would work', type:'textarea', wide:true },

  const opener = document.activeElement;

  const ov = h('div', { class:'overlay', onclick: e => { if (e.target === ov) close(); } }, box);

  const onKey = e => {

    if (e.key !== 'Tab') return;
    const f = [...box.querySelectorAll('button,input,select,textarea,[tabindex="0"]')].filter(x => !x.disabled && x.getClientRects().length);
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (!box.contains(document.activeElement)) { e.preventDefault(); first.focus(); }
    else if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }

  add(box, [h('div', { class:'dhead' }, h('h3', null, title), h('button', { class:'x', 'aria-label':'Close', onclick: close }, '×')), body]);
  document.body.append(ov); document.addEventListener('keydown', onKey, true);
  setTimeout(() => { const f = box.querySelector('input:not([type=checkbox]),select,textarea') || box.querySelector('button:not(.x)'); if (f) f.focus(); }, 30);
  return close;
}

      v = (v - 128) * 1.4 + 128 + 18; v = v < 0 ? 0 : v > 255 ? 255 : v;

async function toJpeg(blob, maxSide, bw) {

}
async function addFiles(files, kind, path, by, status, clean) {
  status.className = 'mstatus';
  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    status.textContent = `Adding ${kind} ${i + 1} of ${files.length}…`;
    try {
      const full = await toJpeg(f, 1600, kind === 'sketch' && clean);
      const data = full.canvas.toDataURL('image/jpeg', 0.85).split(',')[1];
      const small = drawTo(full.canvas, full.w, full.h, 320, false);
      let thumb = small.canvas.toDataURL('image/jpeg', 0.6);
      if (thumb.length > 45000) thumb = small.canvas.toDataURL('image/jpeg', 0.4);
      const r = await api('upload', { data, thumb, name: kind });
      S.thumbs.set(r.id, thumb);
      queuePatch(path, { media: { [r.id]: { kind, by: by || (meKid() ? S.who : 'team'), caption:'', w: full.w, h: full.h, at: Date.now() } } });
      refresh();
    } catch (e) {
      status.className = 'mstatus err';
      status.textContent = uploadError(e, f);
      return;
    }
  }
  flush();
  status.textContent = files.length > 1 ? `Added ${files.length} images. Now write a caption for each.` : 'Added. Now write a caption.';
}
function uploadError(e, f) {
  const code = e && e.code; const nm = f && f.name ? `“${f.name}”` : 'This file';
  if (code === 'decode') return `${nm} could not be opened. Try taking the photo again, or save it as JPEG.`;
  if (code === 'photo_too_large') return `${nm} is too big. Try a smaller photo.`;
  if (code === 'network') return 'The photo was not saved: no connection. Check the Wi-Fi and add it again.';
  if (code === 'upload_limit') return 'The team has added the most photos allowed for today (300). Add this one tomorrow.';
  return 'The photo was not saved. Try again.';
}

async function loadForPdf(id) {
  const r = await api('photo', { id });
  const bytes = Uint8Array.from(atob(r.data), c => c.charCodeAt(0));
  const { canvas, w, h: hh } = await toJpeg(new Blob([bytes], { type:'image/jpeg' }), 1400, false);
  return { data: canvas.toDataURL('image/jpeg', 0.8), w, h: hh };
}
async function runExport(idList, o, st, btn, out) {
  st.className = 'status'; out.replaceChildren();
  if (!window.jspdf || !window.jspdf.jsPDF) { st.textContent = 'The PDF maker did not load. Check the internet connection and reload the page.'; st.className = 'status err'; return; }
  btn.disabled = true;
  try {
    await flushAll();
    const sel = sessions().filter(s => idList.includes(s.id));
    const images = new Map();
    if (o.photos) {
      const media = [];
      if (o.sessions) sel.forEach(s => media.push(...mediaOf(s)));
      if (o.ip) recs('prototypes').forEach(r => media.push(...mediaOf(r.data)));
      if (o.rd) { media.push(...mediaOf(view('ws/rd'))); ['attachments', 'programs'].forEach(k => recs(k).forEach(r => media.push(...mediaOf(r.data)))); }
      for (let i = 0; i < media.length; i++) {
        st.textContent = `Getting photos… ${i + 1} of ${media.length}`;
        if (images.has(media[i].id)) continue;
        try { images.set(media[i].id, await loadForPdf(media[i].id)); } catch (_) { images.set(media[i].id, null); }
      }
    }
    st.textContent = 'Building pages…'; await frame();
    const res = buildPdf(sel, o, images);
    const t = team() || {};
    const fname = [slug(t.name, 'team'), slug(t.number, ''), 'engineering-notebook', todayStr()].filter(Boolean).join('-') + '.pdf';
    const url = URL.createObjectURL(res.blob);
    const a = h('a', { href:url, download:fname }); document.body.append(a); a.click(); setTimeout(() => a.remove(), 1000);
    st.className = 'status ok'; st.textContent = `Done: ${res.pages} pages. Check your Downloads folder, then print.`;
    out.replaceChildren(h('a', { class:'btn', href:url, download:fname, target:'_blank', rel:'noopener' }, 'Download again'));
  } catch (e) {
    st.className = 'status err';
    st.textContent = 'Could not make the PDF: ' + ((e && (e.message || e.code)) || e);
  } finally { btn.disabled = false; }
}

    if (kidsIn.some(k => Object.keys(roleCount[k.id]).length)) {
      sub('Jobs in our sessions', 'team:roles');
      table([{ label:'Team member', w:0.2, bold:true }, { label:'Jobs taken (number of sessions)', w:0.8 }], kidsIn.map(k => [k.name, Object.keys(roleCount[k.id]).map(r => `${RMAP[r].label} (${roleCount[k.id][r]})`).join(', ') || '-']));
    }
    const prog = activeKids().map(k => ({ k, d: view('progress/' + k.id) || {} })).filter(x => Object.keys(x.d).length);
    if (prog.length) {
      sub('Team Progress', 'team:progress', 'Our goals at the start, halfway, and at event time.');
      prog.forEach(({ k, d }) => {
        nameLine(k.name);
        kv('We will use Core Values to', getPath(d, 'start.cv')); kv('We want our robot to', getPath(d, 'start.robot')); kv('We want our innovation project to', getPath(d, 'start.project'));
        kv('So far, I have learned', getPath(d, 'half.learned')); kv('I want to learn more about', getPath(d, 'half.more')); kv('I am proud of my team because we', getPath(d, 'event.proud'));
      });
    }
  }

  // ---------- Innovation Project ----------
  if (opt.ip) {
    const ip = view('ws/ip') || {};
    part('Innovation Project', 'Part 2 · Innovation Project', 'ip');
    if (has(getPath(ip, 'problem.statement')) || has(getPath(ip, 'problem.why'))) {
      sub('Our problem', 'ip:problem');
      kv('Problem statement', getPath(ip, 'problem.statement')); kv('Why it matters for biodiversity', getPath(ip, 'problem.why')); kv('Who or what is affected', getPath(ip, 'problem.who'));
    }
    const rs = recs('research').map(r => r.data);
    if (rs.length) { sub('Research log', 'ip:research', `${rs.length} sources, ${new Set(rs.map(r => r.type).filter(Boolean)).size} kinds of sources.`);
      table([{ label:'Date', w:0.12 }, { label:'Kind', w:0.13 }, { label:'Source', w:0.22 }, { label:'What we learned', w:0.38 }, { label:'Found by', w:0.15 }], rs.slice().reverse().map(r => [r.date ? fmtDate(r.date) : '', r.type, [r.source, r.link].filter(Boolean).join('\n'), r.learned, names(r.by)])); }
    const ids = recs('ideas').map(r => r.data);
    if (ids.length) { sub('Ideas and our choice', 'ip:ideas');
      table([{ label:'Idea', w:0.26, bold:true }, { label:'Status', w:0.12 }, { label:'Votes', w:0.08 }, { label:'Why', w:0.38 }, { label:'Idea from', w:0.16 }], ids.map(r => [r.idea, r.status, r.votes === '' || r.votes == null ? '' : String(r.votes), [r.details, r.why].filter(has).join('\n'), names(r.by)])); }
    const pl = recs('plan').map(r => r.data);
    if (pl.length) { sub('Project plan', 'ip:plan');
      table([{ label:'Step', w:0.42 }, { label:'Who', w:0.22 }, { label:'Finish by', w:0.16 }, { label:'Status', w:0.2 }], pl.map(r => [[r.step, r.notes].filter(has).join('\n'), names(r.who), r.due ? fmtDate(r.due) : '', { text: r.status || '', color: r.status === 'Done' ? C.ok : C.ink }])); }
    if (['name','what','innovative','impact','users'].some(k => has(getPath(ip, 'solution.' + k)))) {
      sub('Our solution', 'ip:solution');
      kv('Name', getPath(ip, 'solution.name')); kv('What it does', getPath(ip, 'solution.what')); kv('What is new about it', getPath(ip, 'solution.innovative'));
      kv('How it helps biodiversity and people', getPath(ip, 'solution.impact')); kv('Who would use it', getPath(ip, 'solution.users'));
    }
    const pv = recs('prototypes').slice().reverse();
    if (pv.length) { sub('Prototype versions', 'ip:prototypes');
      pv.forEach(r => { const d = r.data; nameLine((d.version || 'Version') + (d.date ? ' - ' + fmtDate(d.date) : ''), namesOf(d.by));
        kv('What we made', d.what); kv('What changed and why', d.changed); photos(mediaOf(d), capLabel); y += 4; }); }
    const fb = recs('feedback').map(r => r.data);
    if (fb.length) { sub('Sharing and feedback', 'ip:feedback', `Shared ${fb.length} times with ${new Set(fb.map(f => f.group).filter(Boolean)).size} kinds of people or groups.`);
      table([{ label:'Date', w:0.11 }, { label:'Who', w:0.19 }, { label:'What they said', w:0.3 }, { label:'What we changed', w:0.27 }, { label:'Shared by', w:0.13 }], fb.slice().reverse().map(r => [r.date ? fmtDate(r.date) : '', [r.who, r.group, r.how].filter(has).join('\n'), r.said, r.changed, names(r.by)])); }
    if (has(getPath(ip, 'summary.text'))) { sub('Project summary', 'ip:summary'); para(getPath(ip, 'summary.text')); }
  }

  // ---------- Robot Design ----------
  if (opt.rd) {
    const rd = view('ws/rd') || {};
    part('Robot Design', 'Part 3 · Robot Design', 'rd');
    if (has(getPath(rd, 'robot.base')) || has(getPath(rd, 'robot.why')) || mediaOf(rd).length) {
      sub('Our robot', 'rd:robot');
      if (namesOf(getPath(rd, 'robot.by')).length) para('Built by ' + names(getPath(rd, 'robot.by')), { size:9.5, color:C.ink2, after:8 });
      kv('Drive base', getPath(rd, 'robot.base')); kv('Why we chose it', getPath(rd, 'robot.why')); kv('How it changed', getPath(rd, 'robot.changes'));
      photos(mediaOf(rd), capLabel);
    }
    if (['easy','close','points','tie'].some(k => has(getPath(rd, 'criteria.' + k))) || has(getPath(rd, 'runs.plan'))) {
      sub('How we decide', 'rd:criteria');
      kv('Easy means', getPath(rd, 'criteria.easy')); kv('Close means', getPath(rd, 'criteria.close')); kv('Points', getPath(rd, 'criteria.points'));
      kv('When the rules disagree', getPath(rd, 'criteria.tie')); kv('Our runs', getPath(rd, 'runs.plan'));
    }
    const ms = MISSIONS.map(m => ({ m, d: view('missions/' + m.k) || {} })).filter(x => Object.keys(x.d).some(k => has(x.d[k]) || (Array.isArray(x.d[k]) && x.d[k].length)));
    if (ms.length) { sub('Mission strategy', 'rd:strategy');
      table([{ label:'Mission', w:0.25, bold:true }, { label:'Try?', w:0.09 }, { label:'Pts', w:0.07 }, { label:'Difficulty', w:0.11 }, { label:'Distance', w:0.1 }, { label:'Run', w:0.07 }, { label:'Owner', w:0.13 }, { label:'Notes', w:0.18 }],
        ms.map(({ m, d }) => [`${m.k} ${m.name}`, { text: d.attempt || '', color: d.attempt === 'Yes' ? C.ok : C.ink }, d.points === '' || d.points == null ? '' : String(d.points), d.difficulty, d.distance, d.run, names(d.owner), d.notes]), { size:8.5 }); }
    const res = recs('resources').map(r => r.data);
    if (res.length) { sub('Building and coding resources', 'rd:resources');
      table([{ label:'Resource', w:0.3 }, { label:'Kind', w:0.15 }, { label:'What it helped us do', w:0.4 }, { label:'Used by', w:0.15 }], res.map(r => [[r.title, r.link].filter(Boolean).join('\n'), r.type, r.usedFor, names(r.by)])); }
    const at = recs('attachments');
    if (at.length) { sub('Attachments', 'rd:attachments');
      at.forEach(r => { const d = r.data; nameLine(d.name || 'Attachment', [d.missions].concat(namesOf(d.by)).filter(Boolean));
        if (namesOf(d.ideaBy).length) para('Idea from ' + names(d.ideaBy), { size:9, color:C.ink2, after:4 });
        kv('What it does and why', d.purpose); kv('Versions and changes', d.changes); photos(mediaOf(d), capLabel); y += 4; }); }
    const pg = recs('programs');
    if (pg.length) { sub('Programs', 'rd:programs');
      pg.forEach(r => { const d = r.data; nameLine(d.name || 'Program', [d.missions].concat(namesOf(d.by)).filter(Boolean));
        if (namesOf(d.ideaBy).length) para('Idea from ' + names(d.ideaBy), { size:9, color:C.ink2, after:4 });
        kv('Sensors', (d.sensors || []).join(', ')); kv('How it works', d.how); photos(mediaOf(d), capLabel); y += 4; }); }
    const ts = recs('tests').map(r => r.data);
    if (ts.length) {
      sub('Test log', 'rd:tests', `${ts.length} tests, ${ts.reduce((a, t) => a + num(t.tries), 0)} tries in total.`);
      const by = testStats(); const keys = Object.keys(by).sort();
      table([{ label:'Mission', w:0.2, bold:true }, { label:'Tests', w:0.12 }, { label:'Tries', w:0.12 }, { label:'Worked', w:0.12 }, { label:'Success', w:0.14 }, { label:'Latest test', w:0.3 }],
        keys.map(k => { const t = by[k]; return [k, String(t.n), String(t.tries), String(t.ok), t.tries ? Math.round(100 * t.ok / t.tries) + '%' : '-', t.last && num(t.last.tries) ? `${num(t.last.successes)}/${num(t.last.tries)}` + (t.last.date ? ' on ' + fmtDate(t.last.date) : '') : '-']; }));
      table([{ label:'Date', w:0.1 }, { label:'Mission', w:0.1 }, { label:'Program / attachment', w:0.15 }, { label:'Worked', w:0.08 }, { label:'What went wrong', w:0.22 }, { label:'What we changed', w:0.22 }, { label:'By', w:0.13 }],
        ts.slice().reverse().map(t => [t.date ? fmtDate(t.date) : '', t.mission, [t.program, t.attachment].filter(Boolean).join('\n'), num(t.tries) ? `${num(t.successes)}/${num(t.tries)}` : '', t.problem, t.change, names(t.by)]), { size:8.5 });
    }
    const mt = recs('matches').map(r => r.data);
    if (mt.length) { sub('Practice matches', 'rd:matches', `Best score: ${Math.max(...mt.map(m => num(m.score)))} points.`);
      table([{ label:'Date', w:0.11 }, { label:'Score', w:0.08, bold:true }, { label:'Tokens', w:0.08 }, { label:'Missions that scored', w:0.2 }, { label:'What we learned', w:0.2 }, { label:'Gracious Professionalism', w:0.2 }, { label:'Technicians', w:0.13 }],
        mt.slice().reverse().map(m => [m.date ? fmtDate(m.date) : '', String(num(m.score)), m.tokens === '' || m.tokens == null ? '' : String(m.tokens), m.missions, m.notes, m.gp, names(m.by)]), { size:8.5 }); }
    if (['process','lessons','proud'].some(k => has(getPath(rd, 'summary.' + k)))) {
      sub('Our design process and lessons learned', 'rd:process');
      kv('Our process', getPath(rd, 'summary.process')); kv('What we learned', getPath(rd, 'summary.lessons')); kv('What we are most proud of', getPath(rd, 'summary.proud'));
    }
  }

  // ---------- Sessions ----------
  if (opt.sessions && list.length) {
    const full = sessions();
    list.forEach((s, si) => {
      const idx = full.findIndex(x => x.id === s.id); const prev = idx > 0 ? full[idx - 1] : null;
      newPage(); pageOf.set('s:' + s.id, page()); if (si === 0) pageOf.set('sessions', page()); secN = 0;
      const kids = sessionKids(s);
      fill(C.accent); doc.rect(L, y, 30, 3, 'F'); y += 11;
      font('bold', 9); col(C.accent);
      txt(T(`SESSION ${s.num}` + (s.tmg ? `   ·   TEAM MEETING GUIDE SESSION ${s.tmg}` : '')), L, y, { charSpace: 0.6 });
      font('normal', 9.5); col(C.ink2); txt(T(fmtDate(s.date, true)), L + CW, y, { align:'right' });
      y += 17;
      const p = s.tmg && PLAN[s.tmg];
      const title = has(s.focus) ? s.focus : (p ? p.t.join(' · ') : `Session ${s.num}`);
      font('bold', 20);
      split(title, CW).forEach(ln => { ensure(25); font('bold', 20); col(C.ink); txt(ln, L, y); y += 25; });
      y += 2;
      if (p && has(s.focus)) para('Plan: ' + p.t.join(' · '), { size:9.5, color:C.ink2, after:2 });
      const here = kids.filter(k => !isAbsent(s, k.id)).map(k => k.name + (s.kids && s.kids[k.id] && RMAP[s.kids[k.id].role] ? ` (${RMAP[s.kids[k.id].role].label})` : ''));
      const away = kids.filter(k => isAbsent(s, k.id)).map(k => k.name);
      para('Present: ' + (here.join(', ') || '-') + (away.length ? '      Absent: ' + away.join(', ') : ''), { size:9.5, color:C.ink2, after:10 });
      hr(); y += 4;
      sec('Homework check');
      if (!prev) para('This is the first session in the notebook, so there was no homework to check.', { color:C.ink2, size:10 });
      else {
        const rows = kids.map(k => { const kk = (s.kids && s.kids[k.id]) || {}; const ab = isAbsent(s, k.id);
          return [k.name, (prev.hwNext && prev.hwNext[k.id]) || '-', { text: ab ? 'Absent' : (HWL[kk.hw] || 'Not checked'), color: ab ? C.ink3 : ({ done:C.ok, partly:C.mid, not:C.bad }[kk.hw] || C.ink3) }, ab ? '' : (kk.hwNote || '')]; });
        if (has(prev.hwNext && prev.hwNext.team)) rows.push(['Team', prev.hwNext.team, '', '']);
        table([{ label:'Name', w:0.16, bold:true }, { label:`Homework from Session ${prev.num}`, w:0.38 }, { label:'Status', w:0.15, bold:true }, { label:'What they did', w:0.31 }], rows, { size:9.5 });
      }
      const didKids = kids.filter(k => !isAbsent(s, k.id) && has(s.kids && s.kids[k.id] && s.kids[k.id].did));
      if (has(s.teamDid) || didKids.length) {
        sec('What we did');
        if (has(s.teamDid)) { nameLine('Team'); para(s.teamDid, { after:10 }); }
        didKids.forEach(k => { const kk = s.kids[k.id]; nameLine(k.name, (kk.areas || []).map(a => (AREAS.find(x => x.k === a) || {}).label).filter(Boolean)); para(kk.did, { after:10 }); });
      }
      const lk = kids.filter(k => { const kk = s.kids && s.kids[k.id]; return !isAbsent(s, k.id) && kk && (has(kk.learned) || (kk.values || []).length); });
      if (lk.length) {
        sec('What we learned: Core Values');
        lk.forEach(k => { const kk = s.kids[k.id]; nameLine(k.name, null, (kk.values || []).filter(v => VMAP[v])); if (has(kk.learned)) para(kk.learned, { after:10 }); else y += 4; });
      }
      if (has(s.reflection)) {
        sec('Team reflection');
        if (p) p.q.forEach(q => para('- ' + q, { size:9, style:'italic', color:C.ink2, after:1 }));
        y += 5; para(s.reflection, { after:10 });
      }
      const media = opt.photos ? mediaOf(s) : [];
      if (media.length) {
        const rowsP = photoGrid(media, capLabel);
        ensure(34 + rowsP[0].rowH);
        sec('Photos and sketches');
        drawPhotos(rowsP);
      }
      const hn = s.hwNext || {};
      const hrows = kids.filter(k => has(hn[k.id])).map(k => [k.name, hn[k.id]]);
      if (has(hn.team)) hrows.unshift(['Team', hn.team]);
      if (hrows.length) { sec('Homework for next time'); table([{ label:'Name', w:0.16, bold:true }, { label:'Homework', w:0.84 }], hrows, { size:10 }); }
      const ev = s.evidence || [];
      if (ev.length) {
        const pr = EV_AREAS.map(a => { const st = EV_STEPS.filter(x => ev.includes(`${a.k}:${x}`)); return st.length ? `${a.label}: ${st.join(', ')}` : ''; }).filter(Boolean);
        para('Judging evidence in this session - ' + pr.join('   |   '), { size:8.5, color:C.ink3 });
      }
    });
  }

  // ---------- Core Values + evidence index ----------
  if (opt.summary) {
    part('Core Values', 'Part 5 · Core Values', 'cv');
    sub('Core Values we practiced', 'cv:tally', 'How many sessions each team member chose each Core Value in their own entry.');
    const kidsIn = all.filter(k => list.some(s => hasKidData(s, k.id)));
    if (kidsIn.length) {
      const w0 = 0.2, wr = (1 - w0 - 0.1) / VALUES.length;
      const tot = VALUES.map(() => 0);
      const rows = kidsIn.map(k => { let rt = 0; const cells = VALUES.map((v, i) => { const c = list.filter(s => ((s.kids && s.kids[k.id] && s.kids[k.id].values) || []).includes(v.key)).length; tot[i] += c; rt += c; return String(c); }); return [k.name].concat(cells, [String(rt)]); });
      rows.push([{ text:'Team', color:C.accent }].concat(tot.map(t => ({ text:String(t), color:C.accent })), [{ text:String(tot.reduce((a, b) => a + b, 0)), color:C.accent }]));
      table([{ label:'Team member', w:w0, bold:true }].concat(VALUES.map(v => ({ label:v.key, w:wr })), [{ label:'Total', w:0.1, bold:true }]), rows, { size:10 });
    }
    const st = recs('stories').map(r => r.data);
    if (st.length) { sub('Core Values stories', 'cv:stories');
      table([{ label:'Date', w:0.12 }, { label:'Value', w:0.18, bold:true }, { label:'What happened', w:0.52 }, { label:'Who', w:0.18 }], st.slice().reverse().map(r => [r.date ? fmtDate(r.date) : '', r.value, r.story, names(r.by)])); }
  }

  // ---------- Evidence index ----------
  if (opt.summary) {
    part('Evidence index', 'Where to find it', 'index');
    para('Where to find evidence for each row of the Innovation Project and Robot Design rubrics. Rows marked (CV) also count toward Core Values.', { size:9.5, color:C.ink2, after:10 });
    const WHERE = {
      ip1:['ip:problem'], ip2:['ip:research'], ip3:['ip:plan','ip:ideas'], ip4:['team:who'], ip5:['ip:solution'], ip6:['ip:prototypes'], ip7:['ip:feedback'], ip8:['ip:feedback'], ip9:['ip:solution','ip:summary'], ip10:['team:progress'],
      rd1:['rd:criteria','rd:strategy'], rd2:['rd:resources'], rd3:['team:who','rd:attachments','rd:programs'], rd4:['team:who','team:roles'], rd5:['rd:robot','rd:attachments'], rd6:['rd:programs'], rd7:['rd:tests','rd:matches'], rd8:['rd:tests'], rd9:['rd:process','sessions'], rd10:['rd:process','team:progress'],
    };
    const LABEL = { 'ip:problem':'Our problem', 'ip:research':'Research log', 'ip:plan':'Project plan', 'ip:ideas':'Ideas', 'team:who':'Who did what', 'team:roles':'Jobs', 'ip:solution':'Our solution', 'ip:prototypes':'Prototypes',
      'ip:feedback':'Sharing and feedback', 'ip:summary':'Summary', 'team:progress':'Team Progress', 'rd:criteria':'How we decide', 'rd:strategy':'Mission strategy', 'rd:resources':'Resources', 'rd:attachments':'Attachments',
      'rd:programs':'Programs', 'rd:tests':'Test log', 'rd:matches':'Practice matches', 'sessions':'Session pages', 'rd:robot':'Our robot', 'rd:process':'Process and lessons' };
    const rows = evidence().map(r => {
      const refs = (WHERE[r.id] || []).filter(k => pageOf.has(k)).map(k => `${LABEL[k]} (p. ${pageOf.get(k)})`);
      const tagged = list.filter(s => (s.evidence || []).includes(`${r.area}:${r.step}`) && pageOf.has('s:' + s.id)).map(s => `Session ${s.num} (p. ${pageOf.get('s:' + s.id)})`);
      return [`${r.area === 'ip' ? 'Project' : 'Robot'} · ${r.step}`, r.label + (r.cv ? ' (CV)' : ''), refs.concat(tagged).join(', ') || { text:'Not in this notebook yet', color:C.ink3 }];
    });
    table([{ label:'Rubric area', w:0.2, bold:true }, { label:'What judges look for', w:0.36 }, { label:'Where to find it', w:0.44 }], rows, { size:9 });
  }

  // ---------- Contents ----------
  if (opt.front && contentsPage) {
    doc.setPage(contentsPage); y = TOP;
    font('bold', 22); col(C.ink); txt('Contents', L, y); y += 38;
    const entries = [];
    if (pageOf.has('team')) entries.push(['Part 1', 'Our team', pageOf.get('team')]);
    if (pageOf.has('ip')) entries.push(['Part 2', 'Innovation Project', pageOf.get('ip')]);
    if (pageOf.has('rd')) entries.push(['Part 3', 'Robot Design', pageOf.get('rd')]);
    if (pageOf.has('sessions')) { entries.push(['Part 4', 'Session log', pageOf.get('sessions')]);
      list.forEach(s => { const p = s.tmg && PLAN[s.tmg]; entries.push(['', `Session ${s.num} · ${fmtDate(s.date)} · ${has(s.focus) ? s.focus : (p ? p.t.join(' · ') : '')}`, pageOf.get('s:' + s.id)]); }); }
    if (pageOf.has('cv')) entries.push(['Part 5', 'Core Values', pageOf.get('cv')]);
    if (pageOf.has('index')) entries.push(['', 'Evidence index', pageOf.get('index')]);
    const stepH = Math.max(11, Math.min(20, (H - BOT - 20 - y) / Math.max(1, entries.length)));
    const fs = stepH < 14 ? 9 : 10.5;
    entries.forEach(([a, b, pg]) => {
      font('bold', fs); col(C.accent); txt(T(a), L, y);
      let t = T(b); font(a ? 'bold' : 'normal', fs); col(C.ink);
      const maxW = CW - 60 - 40;
      if (doc.getTextWidth(t) > maxW) { while (t && doc.getTextWidth(t + '...') > maxW) t = t.slice(0, -1); t = t.replace(/\s+$/, '') + '...'; }
      txt(t, L + 60, y);
      font('bold', fs); col(C.accent); txt(String(pg), L + CW, y, { align:'right' });
      y += stepH;
    });
  }

  // ---------- Footers ----------
  const n = page();
  for (let i = 1; i <= n; i++) {
    if (opt.front && i === 1) continue;
    doc.setPage(i);
    stroke(C.line); doc.setLineWidth(0.5); doc.line(L, H - 44, L + CW, H - 44);
    font('normal', 8); col(C.ink3);
    txt(`${tname}${tnum ? ' #' + tnum : ''}  ·  Engineering Notebook  ·  ${season}`, L, H - 38);
    txt(String(i), L + CW, H - 38, { align:'right' });
  }
  if (blank) { font('normal', 12); col(C.ink2); txt('Nothing selected to print.', L, TOP); }
  doc.setProperties({ title: `${tname} Engineering Notebook`, subject: 'FIRST LEGO League Challenge ' + season, author: tname, creator: 'Team logbook' });
  return { blob: doc.output('blob'), pages: n };
}


function boot() {
  if (S.pin) S.role = LS.get('mb.role') || null;
  loadCache();
  render();
  if (S.pin && /^https:\/\//.test(API_URL)) sync(true).then(() => { if (P.size) schedule(200); });
  setInterval(() => sync(false), 15000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') sync(true); else flush(); });
  window.addEventListener('online', () => { Q.failed = false; Q.retries = 0; flush(); sync(true); });
  window.addEventListener('pagehide', () => { flush(); });
}
boot();

})();
</script>
</body>
</html>
